<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>452 출발 계산기</title>
<style>body{font:16px -apple-system,sans-serif;padding:24px;color:#6b7480}@media(prefers-color-scheme:dark){body{background:#0f1318;color:#97a1ae}}</style>
</head>
<body>
<!-- 이 파일은 거의 바뀌지 않는 "로더"예요.
     실제 화면(app.html)은 매번 주소 뒤에 현재 시각을 붙여 새로 받아오기 때문에
     사파리/CDN 캐시가 남아 있어도 항상 최신 버전이 떠요. -->
불러오는 중…
<script>
(async () => {
  try {
    const r = await fetch('app.html?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const html = await r.text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.body.textContent = '불러오지 못했어요. 새로고침해 주세요. (' + e.message + ')';
  }
})();
</script>
</body>
</html>
