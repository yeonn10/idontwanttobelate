<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>몇 시에 출발하지?</title>
<style>
  /* 디자인 기준: Apple 스타일 — 흰색/파치먼트/니어블랙 타일 교차, 단일 액센트(Action Blue), 그림자·그라데이션 없음 */
  :root {
    --canvas:#ffffff; --parchment:#f5f5f7; --card:#ffffff;
    --ink:#1d1d1f; --muted:#7a7a7a; --hairline:#e0e0e0; --soft:#f0f0f0;
    --primary:#0066cc; --focus:#0071e3;
    --tile:#272729; --on-tile:#ffffff; --tile-muted:#cccccc; --link-dark:#2997ff;
    --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Pretendard", "Noto Sans KR", sans-serif;
  }
  :root { color-scheme: light; } /* 폰이 다크모드여도 항상 밝은 화면으로 표시 */
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--canvas); color:var(--ink); font:400 17px/1.47 var(--font); letter-spacing:-0.374px; -webkit-font-smoothing:antialiased; }
  .inner { max-width:560px; margin:0 auto; padding:0 20px; }
  .num { font-variant-numeric:tabular-nums; }

  /* 상단: 제목 + 현재 시각 (흰 캔버스) */
  .hero { background:var(--canvas); padding:28px 0 32px; }
  h1 { margin:0 0 20px; font-size:clamp(26px, 8vw, 34px); font-weight:600; line-height:1.15; letter-spacing:-0.374px; }
  .caption { font-size:14px; line-height:1.43; letter-spacing:-0.224px; color:var(--muted); }
  .clockbig { font-size:40px; font-weight:600; line-height:1.1; letter-spacing:-0.28px; font-variant-numeric:tabular-nums; margin-top:4px; }

  /* 파치먼트 밴드 */
  .parch { background:var(--parchment); padding:24px 0; }
  .card { background:var(--card); border:1px solid var(--hairline); border-radius:18px; padding:24px; }

  /* 마감 시각 / 걷는 시간 */
  .field-label { font-size:14px; letter-spacing:-0.224px; color:var(--muted); margin-bottom:8px; }
  input { font:inherit; color:var(--ink); background:var(--canvas); border:1px solid var(--hairline); border-radius:9999px; outline:none; -webkit-appearance:none; appearance:none; }
  input:focus { border-color:var(--focus); box-shadow:none; outline:2px solid var(--focus); outline-offset:1px; }
  input[type=time] { display:block; width:100%; height:56px; padding:0 22px; font-size:28px; font-weight:600; letter-spacing:-0.28px; text-align:left; font-variant-numeric:tabular-nums; }
  .walks { display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:18px; }
  .walks label { display:flex; align-items:center; gap:8px; font-size:14px; letter-spacing:-0.224px; color:var(--muted); white-space:nowrap; }
  .walks input { width:56px; height:34px; padding:0 8px; font-size:15px; text-align:center; letter-spacing:0; }

  /* 결과 (니어블랙 타일) */
  .tile { background:var(--tile); color:var(--on-tile); padding:40px 0 36px; }
  .result .head { font-size:14px; letter-spacing:-0.224px; color:var(--tile-muted); }
  .result .big { font-size:clamp(44px, 14vw, 56px); font-weight:600; line-height:1.07; letter-spacing:-0.28px; margin:6px 0 10px; font-variant-numeric:tabular-nums; }
  .result .big small { font-size:17px; font-weight:400; letter-spacing:-0.374px; color:var(--tile-muted); margin-left:10px; white-space:nowrap; }
  .result.go .big small { color:var(--link-dark); font-weight:600; }
  .result .sub { font-size:15px; line-height:1.47; letter-spacing:-0.224px; color:var(--tile-muted); }
  .result .flow b { color:var(--on-tile); font-weight:600; }

  /* 상세 정보 */
  h2 { margin:0 0 14px 2px; font-size:21px; font-weight:600; line-height:1.19; letter-spacing:0.231px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .route { font-size:17px; font-weight:600; letter-spacing:-0.374px; }
  .route span { font-weight:400; font-size:14px; letter-spacing:-0.224px; color:var(--muted); margin-left:6px; }
  button { font:inherit; font-size:14px; letter-spacing:-0.224px; cursor:pointer; padding:9px 18px; border-radius:9999px; background:transparent; color:var(--primary); border:1px solid var(--primary); transition:transform .1s; }
  button:active { transform:scale(0.95); }
  button:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  table { width:100%; border-collapse:collapse; margin-top:14px; }
  th { text-align:left; font-weight:400; color:var(--muted); font-size:12px; letter-spacing:-0.12px; padding:4px 4px 8px; }
  td { padding:12px 4px; border-top:1px solid var(--hairline); font-variant-numeric:tabular-nums; vertical-align:top; }
  td.big { font-size:17px; font-weight:600; }
  .sub { color:var(--muted); font-size:13px; letter-spacing:-0.224px; line-height:1.4; }
  .tag { font-size:11px; letter-spacing:0; padding:1px 7px; border-radius:9999px; border:1px solid var(--hairline); color:var(--muted); white-space:nowrap; }
  .tag.rt { color:var(--primary); border-color:var(--primary); }
  tr.pick td { background:color-mix(in srgb, var(--primary) 8%, transparent); }
  #meta { margin-top:12px; font-size:12px; letter-spacing:-0.12px; color:var(--muted); }
  .err { color:#dc2626; font-size:14px; margin-top:8px; }
  .banner { background:var(--soft); border:1px solid var(--hairline); border-radius:11px; padding:10px 14px; font-size:13px; letter-spacing:-0.224px; margin-bottom:16px; }
</style>
</head>
<body>

<header class="hero">
  <div class="inner">
    <h1>몇 시에 출발하지?</h1>
    <div id="mock" class="banner" hidden>샘플 데이터예요. 실시간 데이터가 아니에요.</div>
    <div class="caption">현재 시각</div>
    <div class="clockbig" id="clock">--:--:--</div>
  </div>
</header>

<section class="parch">
  <div class="inner">
    <div class="card">
      <div class="field-label">도착 마감시각 (학교 도착)</div>
      <input type="time" id="deadline">
      <div class="walks">
        <label>집→정류장 걷는 시간 <input type="number" id="walk" min="0" value="8" inputmode="numeric"> 분</label>
        <label>정류장→학교 걷는 시간 <input type="number" id="walk2" min="0" value="10" inputmode="numeric"> 분</label>
      </div>
    </div>
  </div>
</section>

<section class="tile">
  <div class="inner">
    <div class="result" id="result"><div class="head">불러오는 중…</div></div>
  </div>
</section>

<section class="parch" style="padding-bottom:40px">
  <div class="inner">
    <h2>상세 정보</h2>
    <div class="card" style="padding:20px">
      <div class="row">
        <div class="route">452번<span>반포역 → 중앙대학교</span></div>
        <button id="refresh">새로고침</button>
      </div>
      <table>
        <thead><tr><th>반포역 도착</th><th>집 출발</th><th>중앙대 도착</th><th>소요</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="meta"></div>
      <div class="err" id="err"></div>
    </div>
  </div>
</section>

<script>
// Cloudflare Worker 주소
const API_URL = 'https://bus452.jwiie10.workers.dev/api/arrivals';
const $ = (id) => document.getElementById(id);
const HALF = 30 * 60000;
let data = null;
let auto = true; // 마감시각 자동 설정 여부

const pad = (n) => String(n).padStart(2, '0');
const fmt = (ms) => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
// 12시간제 표기: 오후 3:51
const fmtK = (ms) => { const d = new Date(ms); const h = d.getHours(); return (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + ':' + pad(d.getMinutes()); };
$('walk').value = localStorage.getItem('walk') || 8;
$('walk2').value = localStorage.getItem('walk2') || 10;

// ---------- 데이터 ----------
async function load() {
  $('err').textContent = '';
  if (API_URL.includes('YOUR-WORKER')) { $('err').textContent = 'app.html 위쪽의 API_URL을 내 Worker 주소로 바꿔야 해요.'; return; }
  try {
    const r = await fetch(API_URL, { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    data = j;
  } catch (e) { $('err').textContent = e.message; }
  renderAll();
}

// 마감 시각이 목록보다 뒤면 배차간격으로 추가 버스를 추정해서 이어 붙임
function list(deadlineMs) {
  if (!data) return [];
  const walk = (+$('walk').value || 0) * 60000;
  const l = data.buses.map((b) => ({ ...b }));
  if (deadlineMs && data.term > 0 && l.length) {
    let g = 0;
    while (g++ < 40) {
      const last = l[l.length - 1];
      if (last.busAt + last.rideMin * 60000 > deadlineMs) break;
      l.push({ busAt: last.busAt + data.term * 60000, rideMin: last.rideMin, source: 'estimated', rideSource: 'segments' });
    }
  }
  return l.map((b) => ({ ...b, leaveAt: b.busAt - walk, arriveAt: b.busAt + b.rideMin * 60000 }));
}

// ---------- 마감 시각 ----------
// 현재 시각 + 30분 이후의 가장 빠른 정각 또는 30분
function autoDeadline() { return Math.ceil((Date.now() + HALF) / HALF) * HALF; }

function getDeadline() {
  if (auto) return autoDeadline();
  const v = $('deadline').value;
  if (!v) return null;
  const [h, m] = v.split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  if (d.getTime() < Date.now() - 60000) d.setDate(d.getDate() + 1);
  return d.getTime();
}

// ---------- 렌더링 ----------
function renderClock() {
  $('clock').textContent = new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
  if (auto) { const v = fmt(autoDeadline()); if ($('deadline').value !== v) { $('deadline').value = v; renderResult(); } }
}

function renderResult() {
  const box = $('result');
  if (!data) return;
  const dl = getDeadline();
  if (dl == null) { box.className = 'result'; box.innerHTML = '<div class="head">도착 마감시각을 입력해 주세요.</div>'; return; }
  const walk2 = (+$('walk2').value || 0) * 60000; // 정류장->학교 걷는 시간
  const target = dl - walk2; // 이 시각까지 중앙대 정류장에 도착해야 함
  const cands = list(target).filter((b) => b.arriveAt <= target && b.leaveAt > Date.now() - 60000);
  window.__pick = null;
  if (!cands.length) {
    box.className = 'result';
    box.innerHTML = '<div class="head">마지노선 집 출발</div><div class="big">-</div><div class="sub">이 시각까지 도착 가능한 버스가 없어요. 마감시각이나 걷는 시간을 확인해 보세요.</div>';
    return;
  }
  const b = cands[cands.length - 1];
  window.__pick = b.busAt;
  const left = Math.floor((b.leaveAt - Date.now()) / 60000);
  const go = left <= 0;
  box.className = 'result' + (go ? ' go' : '');
  box.innerHTML = `
    <div class="head">마지노선 집 출발</div>
    <div class="big">${fmtK(b.leaveAt)}<small>${go ? '지금 바로 출발!' : '(' + left + '분 뒤)'}</small></div>
    <div class="sub flow"><b>${fmt(b.busAt)}</b> 탑승 → <b>${fmt(b.arriveAt)}</b> 정류장 도착 → <b>${fmt(b.arriveAt + walk2)}</b> 학교 도착${b.source === 'estimated' ? ' · 배차간격 추정' : ''}</div>`;
  markPick();
}

function markPick() {
  document.querySelectorAll('#rows tr').forEach((tr) => tr.classList.toggle('pick', String(tr.dataset.bus) === String(window.__pick)));
}

function renderTable() {
  $('mock').hidden = !(data && data.mock);
  const src = { official: '<span class="tag rt">공식예측</span>', position: '<span class="tag">위치기반</span>', estimated: '<span class="tag">배차추정</span>' };
  const rows = list(null).filter((b) => b.leaveAt > Date.now() - 60000);
  $('rows').innerHTML = rows.map((b) => `<tr data-bus="${b.busAt}">
    <td>${fmt(b.busAt)} ${src[b.source] || ''}<div class="sub">${b.stopsAway != null && b.where ? `${b.where} 방향 이동 중 · 반포역까지 ${b.stopsAway}정거장` : ''}</div></td>
    <td class="big">${fmt(b.leaveAt)}</td><td>${fmt(b.arriveAt)}</td><td>${Math.round(b.rideMin)}분</td></tr>`).join('');
  if (data) $('meta').textContent = `갱신 ${fmt(data.now)} · 배차간격 ${data.term || '?'}분` + (data.calibErrSec != null ? ` · 위치기반 예측 오차 평균 약 ${data.calibErrSec}초` : '') + ' · 파란 줄 = 마지노선 버스';
  markPick();
}

function renderAll() { renderTable(); renderResult(); }

// ---------- 이벤트 ----------
$('deadline').addEventListener('input', () => { auto = false; renderResult(); });
$('walk2').oninput = () => { localStorage.setItem('walk2', $('walk2').value); renderResult(); };
$('walk').oninput = () => { localStorage.setItem('walk', $('walk').value); renderAll(); };
$('refresh').onclick = load;

// 1초마다 시계/남은 시간 갱신, 60초마다 데이터 갱신(화면이 숨겨지면 멈춤 -> API 호출 절약)
setInterval(() => { renderClock(); renderResult(); }, 1000);
setInterval(() => { if (!document.hidden) load(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
$('deadline').value = fmt(autoDeadline());
renderClock();
load();
</script>
</body>
</html>
